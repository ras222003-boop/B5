name: iOS LiDAR simulator compile
on:
  pull_request:
    paths:
      - "ios/DepthCalibrationLab/**"
      - ".github/workflows/ios-lidar-compile.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-native-lidar:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate app icon
        run: python3 ios/DepthCalibrationLab/scripts/generate-lab-icon.py
      - name: Test StoreKit checkout gating (no payments)
        run: python3 ios/DepthCalibrationLab/scripts/test_configure_storekit.py
      - name: Test approved web-origin configuration (no deployment)
        run: python3 ios/DepthCalibrationLab/scripts/test_configure_web_origin.py
      - name: Test embedded WebKit media lifecycle (no permissions or camera)
        run: node --test ios/DepthCalibrationLab/scripts/test-web-media-lifecycle.mjs
      - name: Generate iOS project
        run: |
          cd ios/DepthCalibrationLab
          xcodegen generate
      - name: Compile Swift app against iOS Simulator SDK (no signing)
        run: |
          xcodebuild \
            -project ios/DepthCalibrationLab/BasiraDepthCalibrationLab.xcodeproj \
            -scheme BasiraDepthCalibrationLab \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Run native measurement unit tests
        run: |
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPhone") and d.get("isAvailable", True)))')"
          xcodebuild test \
            -project ios/DepthCalibrationLab/BasiraDepthCalibrationLab.xcodeproj \
            -scheme BasiraDepthCalibrationLab \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO
