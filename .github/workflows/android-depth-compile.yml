name: Android ARCore depth compile
on:
  pull_request:
    paths:
      - "android/DepthLab/**"
      - ".github/workflows/android-depth-compile.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-android-depth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build ARCore research APK
        run: gradle -p android/DepthLab :app:assembleDebug --no-daemon
      - name: Attach internal debug APK
        uses: actions/upload-artifact@v4
        with:
          name: basira-arcore-depth-lab-debug
          path: android/DepthLab/app/build/outputs/apk/debug/*.apk
          retention-days: 7
