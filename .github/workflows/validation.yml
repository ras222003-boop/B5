name: Basira validation

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  check-test-build-and-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: basira_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pbasira_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/metric-depth/verify-artifact.mjs
      - run: pnpm check
      - run: pnpm exec tsc --noEmit -p tsconfig.manus-preview.json
      - run: pnpm exec tsc --noEmit -p tsconfig.github-preview.json
      - run: node --test scripts/github-preview/policy.test.mjs
      - run: pnpm test
      - run: pnpm test:perception-metrics
      - run: pnpm test:vision-ai
      - run: node --test scripts/vision-object-finetune-v4/*.test.mjs
      - run: pnpm test:vision-studio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/vision-ai -p 'test_*.py'
      - run: node --test scripts/auto-meter-report.test.mjs
      - run: pnpm build
      - name: Validate fresh MySQL migrations
        env:
          DATABASE_URL: mysql://root:basira_ci_only@127.0.0.1:3306/basira_validation_fresh
        run: pnpm exec tsx scripts/validation-gate-db.ts fresh
      - name: Validate B5 to B6 MySQL upgrade
        env:
          DATABASE_URL: mysql://root:basira_ci_only@127.0.0.1:3306/basira_validation_upgrade
        run: pnpm exec tsx scripts/validation-gate-db.ts upgrade
