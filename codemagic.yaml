# Native iOS prototype. Run validation first; the separate signed workflow must
# only be started after explicit approval for TestFlight submission.
workflows:
  basira-native-ios-validation:
    name: Basira native iOS — simulator build and unit tests
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Generate unsigned native project
        script: |
          #!/bin/bash
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          python3 ios/DepthCalibrationLab/scripts/generate-lab-icon.py
          cd ios/DepthCalibrationLab
          xcodegen generate
      - name: Build and test on iPhone simulator
        script: |
          #!/bin/bash
          set -euo pipefail
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPhone") and d.get("isAvailable", True)))')"
          xcodebuild test \
            -project ios/DepthCalibrationLab/BasiraDepthCalibrationLab.xcodeproj \
            -scheme BasiraDepthCalibrationLab \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -resultBundlePath "$CM_BUILD_DIR/ios-native-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios-native-tests.xcresult
      - /tmp/xcodebuild_logs/*.log

  # Apple credentials are held only in the Codemagic integration "basira_apple".
  # This workflow publishes to TestFlight and is never started automatically.
  basira-iphone14pro-testflight:
    name: Basira native LiDAR (iPhone 14 Pro) — approved TestFlight only
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: basira_apple
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: sa.basira.nativeprototype
      vars:
        XCODE_SCHEME: "BasiraDepthCalibrationLab"
      xcode: latest
    scripts:
      - name: Generate signed iOS project
        script: |
          #!/bin/bash
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          python3 ios/DepthCalibrationLab/scripts/generate-lab-icon.py
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${PROJECT_BUILD_NUMBER:?}" ios/DepthCalibrationLab/DepthCalibrationLab/Info.plist
          cd ios/DepthCalibrationLab
          xcodegen generate

      - name: Apply Apple distribution profile
        script: |
          #!/bin/bash
          set -euo pipefail
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/ios/DepthCalibrationLab/BasiraDepthCalibrationLab.xcodeproj"

      - name: Create distribution-signed IPA
        script: |
          #!/bin/bash
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/DepthCalibrationLab/BasiraDepthCalibrationLab.xcodeproj" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Basira Internal Testers
        submit_to_app_store: false
